
name: Android Private Device - 5 Runs

on:
  workflow_dispatch:

concurrency:
  group: android-private-device-5-runs
  cancel-in-progress: false

jobs:
  android-test:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test 5 times
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
        run: bash ./run-50-times.sh
